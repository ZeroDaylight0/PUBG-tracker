<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUBG Tracker - Start</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px;
            width: 90%;
            max-width: 480px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #f97316;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .subtitle {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 32px;
        }
        .form-group {
            margin-bottom: 24px;
        }
        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.7);
        }
        input, select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            transition: all 0.2s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #f97316;
            background: rgba(255, 255, 255, 0.12);
        }
        input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
        .range-container {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        input[type="range"] {
            flex: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            outline: none;
            padding: 0;
        }
        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 18px;
            height: 18px;
            background: #f97316;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            background: #f97316;
            border: none;
            border-radius: 50%;
            cursor: pointer;
        }
        .range-value {
            font-size: 18px;
            font-weight: 700;
            color: #f97316;
            min-width: 40px;
            text-align: center;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #f97316;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover {
            background: #ea580c;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(249, 115, 22, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        button:disabled {
            background: rgba(255, 255, 255, 0.1);
            cursor: not-allowed;
            transform: none;
        }
        button.secondary {
            background: transparent;
            border: 1px solid rgba(249, 115, 22, 0.6);
            color: #fdba74;
            margin-top: 12px;
        }
        button.secondary:hover { background: rgba(249, 115, 22, 0.12); }
        .hidden { display: none !important; }
        .hint { font-size: 11px; color: rgba(255, 255, 255, 0.45); margin-top: 6px; line-height: 1.5; }
        .hint a { color: #fdba74; }
        .check { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 12px; color: rgba(255,255,255,0.6); text-transform: none; letter-spacing: 0; font-weight: 500; }
        .check input { width: auto; accent-color: #f97316; }
        .mode-note { font-size: 11px; color: rgba(255, 255, 255, 0.5); background: rgba(56, 189, 248, 0.08); border: 1px solid rgba(56, 189, 248, 0.25); border-radius: 8px; padding: 10px 12px; margin-bottom: 20px; line-height: 1.5; }
        .divider { text-align: center; font-size: 11px; color: rgba(255,255,255,0.35); margin: 18px 0 0; text-transform: uppercase; letter-spacing: 1px; }
        .loader {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
        .loader.active {
            display: block;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #f97316;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loader-text {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
        }
        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            padding: 12px;
            margin-top: 16px;
            font-size: 13px;
            color: #fca5a5;
            display: none;
        }
        .error.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>PUBG Tracker</h1>
        <p class="subtitle">Match and stats analysis</p>

        <div class="mode-note hidden" id="browserNote">
            Live demo: requests go from your browser straight to the official PUBG API with your own key.
            The key stays in this browser. Try the demo matches if you don't have a key.
        </div>

        <form id="startForm">
            <div class="form-group hidden" id="keyGroup">
                <label>PUBG API key</label>
                <input type="password" id="apiKey" placeholder="eyJ0eXAiOi..." autocomplete="off">
                <label class="check"><input type="checkbox" id="rememberKey"> Remember on this device</label>
                <div class="hint">Free key: <a href="https://developer.pubg.com/" target="_blank" rel="noopener">developer.pubg.com</a> → create an app → copy the key.</div>
            </div>

            <div class="form-group">
                <label>Player nickname</label>
                <input type="text" id="nickname" placeholder="Enter a nickname" required>
            </div>

            <div class="form-group">
                <label>Platform</label>
                <select id="platform">
                    <option value="steam">Steam</option>
                    <option value="kakao">Kakao</option>
                    <option value="psn">PlayStation</option>
                    <option value="xbox">Xbox</option>
                    <option value="console">Console (cross-play)</option>
                    <option value="stadia">Stadia</option>
                </select>
            </div>

            <div class="form-group">
                <label>Number of matches</label>
                <div class="range-container">
                    <input type="range" id="matchCount" min="1" max="20" value="5">
                    <span class="range-value" id="matchValue">5</span>
                </div>
            </div>

            <button type="submit">Load matches</button>
        </form>
        <div class="divider">or</div>
        <button type="button" class="secondary" id="demoBtn">Open demo matches</button>

        <div class="loader" id="loader">
            <div class="spinner"></div>
            <div class="loader-text">Loading data...</div>
        </div>

        <div class="error" id="error"></div>
    </div>

    <script src="pubg-data.js"></script>
    <script>
        const rangeInput = document.getElementById('matchCount');
        const rangeValue = document.getElementById('matchValue');
        const form = document.getElementById('startForm');
        const loader = document.getElementById('loader');
        const errorBox = document.getElementById('error');

        let mode = 'server';
        PubgData.detectMode().then((m) => {
            mode = m;
            if (mode === 'browser') {
                document.getElementById('browserNote').classList.remove('hidden');
                document.getElementById('keyGroup').classList.remove('hidden');
                document.getElementById('apiKey').value = PubgData.apiKey.get();
                document.getElementById('rememberKey').checked = PubgData.apiKey.remembered();
            }
        });

        document.getElementById('demoBtn').addEventListener('click', async () => {
            errorBox.classList.remove('active');
            try {
                await PubgData.loadDemo();
                window.location.href = 'index.html';
            } catch (err) {
                showError(err.message || 'Could not load the demo');
            }
        });

        // Remember the last search
        try {
            const saved = JSON.parse(localStorage.getItem('pubgTrackerSearch') || '{}');
            if (saved.nickname) document.getElementById('nickname').value = saved.nickname;
            if (saved.platform) document.getElementById('platform').value = saved.platform;
            if (saved.count) { rangeInput.value = saved.count; rangeValue.textContent = saved.count; }
        } catch (e) { /* storage unavailable */ }

        rangeInput.addEventListener('input', (e) => {
            rangeValue.textContent = e.target.value;
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const nickname = document.getElementById('nickname').value.trim();
            const platform = document.getElementById('platform').value;
            const count = document.getElementById('matchCount').value;

            if (!nickname) {
                showError('Enter a player nickname');
                return;
            }

            try { localStorage.setItem('pubgTrackerSearch', JSON.stringify({ nickname, platform, count })); } catch (e) { /* ignore */ }

            loader.classList.add('active');
            errorBox.classList.remove('active');
            form.querySelector('button').disabled = true;

            if (mode === 'browser') {
                const key = document.getElementById('apiKey').value.trim();
                if (!key) {
                    showError('Enter your PUBG API key or open the demo matches');
                    loader.classList.remove('active');
                    form.querySelector('button').disabled = false;
                    return;
                }
                PubgData.apiKey.set(key, document.getElementById('rememberKey').checked);
                try {
                    const matches = await PubgData.loadMatchesDirect({ key, nickname, platform, count });
                    if (!PubgData.saveSession(matches, false)) throw new Error('Browser storage is disabled');
                    window.location.href = 'index.html';
                } catch (err) {
                    showError(err.message || 'Failed to load data');
                } finally {
                    loader.classList.remove('active');
                    form.querySelector('button').disabled = false;
                }
                return;
            }

            try {
                PubgData.clearSession();
                const response = await fetch('start_analysis', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nickname, platform, count: parseInt(count) })
                });

                const result = await response.json();

                if (result.success) {
                    window.location.href = 'index.html';
                } else {
                    showError(result.error || 'Failed to load data');
                }
            } catch (err) {
                showError('Could not connect to the server');
            } finally {
                loader.classList.remove('active');
                form.querySelector('button').disabled = false;
            }
        });

        function showError(message) {
            errorBox.textContent = message;
            errorBox.classList.add('active');
        }
    </script>
</body>
</html>
