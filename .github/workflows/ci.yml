name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Python tests
        run: python -m pytest tests
      - name: JavaScript tests
        run: node --test tests/
      - name: Launcher smoke test (Linux)
        if: runner.os == 'Linux'
        run: ./start.sh --help
      - name: Launcher smoke test (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: call start.bat --help

  styles:
    name: tailwind.css is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - name: Rebuild and compare
        run: |
          npm run build:css
          if ! git diff --exit-code -- tailwind.css; then
            echo "::error file=tailwind.css::tailwind.css is out of date. Run npm run build:css and commit it."
            exit 1
          fi
