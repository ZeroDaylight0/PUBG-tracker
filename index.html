<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUBG Tactical Analyzer</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="telemetry.js"></script>
    <script src="pubg-data.js"></script>
    <script src="heatmap.js"></script>
    <style>
        body { background-color: #06080a; color: #eee; font-family: 'Inter', sans-serif; overflow: hidden; }
        canvas { background-color: #000; cursor: grab; display: block; }
        canvas.dragging { cursor: grabbing; }
        .ui-card { background: rgba(15, 20, 26, 0.98); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); }
        .btn { transition: all 0.2s; border: 1px solid rgba(255,255,255,0.1); font-size: 10px; font-weight: 800; text-transform: uppercase; }
        .active { background: #f97316 !important; border-color: #f97316 !important; color: #fff !important; }
        .m-item { border-left: 3px solid transparent; transition: all 0.2s; cursor: pointer; }
        .m-item:hover { background: rgba(255,255,255,0.05); }
        .m-item.selected { border-left-color: #f97316; background: rgba(249, 115, 22, 0.15); }
        .ev { border-left: 2px solid; padding: 6px 8px; font-size: 10px; cursor: pointer; border-radius: 0 4px 4px 0; transition: background 0.15s; }
        .ev:hover { filter: brightness(1.3); }
        .ev-sub { font-size: 9px; color: #64748b; margin-top: 2px; }
        .ev-time { float: right; font-size: 9px; color: #64748b; font-variant-numeric: tabular-nums; }
        .ev-KILL { border-color: #ef4444; background: rgba(239,68,68,0.07); }
        .ev-FINISH { border-color: #fb923c; background: rgba(251,146,60,0.07); }
        .ev-KNOCK { border-color: #facc15; background: rgba(250,204,21,0.07); }
        .ev-KNOCKED { border-color: #a855f7; background: rgba(168,85,247,0.07); }
        .ev-REVIVE, .ev-REVIVED { border-color: #22c55e; background: rgba(34,197,94,0.07); }
        .ev-DEATH { border-color: #fff; background: rgba(255,255,255,0.1); }
        .hs { color: #f87171; font-weight: 800; }
        .stat { background: rgba(255,255,255,0.05); padding: 8px 10px; border-radius: 4px; }
        .stat-l { font-size: 8px; color: #64748b; text-transform: uppercase; }
        .stat-v { font-size: 12px; font-weight: 900; }
        .legend i { width: 14px; text-align: center; }
        #tooltip {
            pointer-events: none;
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            border: 1px solid rgba(249, 115, 22, 0.5);
            border-radius: 8px;
            font-size: 11px;
            z-index: 1000;
            display: none;
            position: absolute;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.05);
            min-width: 220px;
            overflow: hidden;
        }
        .tooltip-header { padding: 8px 12px; border-bottom: 1px solid; font-weight: 700; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
        .tooltip-body { padding: 10px 12px; }
        .tooltip-row { display: flex; justify-content: space-between; gap: 16px; padding: 3px 0; font-size: 11px; }
        .tooltip-label { color: rgba(255, 255, 255, 0.5); font-weight: 500; }
        .tooltip-value { color: #fff; font-weight: 600; }
        .tab { font-size: 8px; font-weight: 900; text-transform: uppercase; padding: 3px 7px; border-radius: 4px; color: #64748b; background: rgba(255,255,255,0.04); }
        .tab.active { color: #fff; }
        .flt { background: #11151b; border: 1px solid rgba(255,255,255,0.08); border-radius: 4px; font-size: 9px; color: #cbd5e1; padding: 3px 4px; min-width: 0; }
        .heat-legend { height: 6px; border-radius: 3px; background: linear-gradient(90deg, #2563eb, #06b6d4, #22c55e, #facc15, #f97316, #dc2626); }
        .custom-scroll::-webkit-scrollbar { width: 3px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <header class="h-14 border-b border-white/5 flex items-center justify-between px-6 bg-[#0c0e12] z-50">
        <div class="flex items-center gap-4 min-w-0">
            <a href="start.html" title="New search" class="bg-orange-600 hover:bg-orange-500 p-1.5 rounded text-white"><i class="fa-solid fa-magnifying-glass"></i></a>
            <span id="modeBadge" class="hidden text-[8px] font-black uppercase tracking-widest px-2 py-1 rounded bg-sky-500/15 text-sky-300"></span>
            <h1 id="matchTitle" class="font-black text-xs tracking-tighter uppercase italic text-slate-400 truncate">Tactical Analyzer</h1>
        </div>
        <div id="quickStats" class="text-[10px] font-black flex gap-6 text-orange-500 uppercase tracking-widest"></div>
    </header>

    <div class="flex-grow relative flex overflow-hidden">

        <!-- Left: History & Team -->
        <div class="w-64 shrink-0 bg-[#0c0e12] border-r border-white/5 flex flex-col z-40">
            <div class="p-4 border-b border-white/5 h-1/2 flex flex-col overflow-hidden">
                <div class="flex items-center justify-between mb-3">
                    <h3 class="text-[9px] font-black text-slate-600 uppercase">Match History</h3>
                    <div id="historyTabs" class="hidden flex gap-1">
                        <button data-tab="recent" class="tab active">Search</button>
                        <button data-tab="stored" class="tab" title="Matches saved in the local database">Stored <span id="storedCount"></span></button>
                    </div>
                </div>
                <div id="matchList" class="flex-grow overflow-y-auto space-y-1 custom-scroll"></div>
                <div id="storedPanel" class="hidden flex-grow flex flex-col overflow-hidden">
                    <div class="grid grid-cols-3 gap-1 mb-2">
                        <select id="fltPlayer" class="flt" title="Player"></select>
                        <select id="fltMap" class="flt" title="Map"></select>
                        <select id="fltMode" class="flt" title="Mode"></select>
                    </div>
                    <div id="storedList" class="flex-grow overflow-y-auto space-y-1 custom-scroll"></div>
                    <div class="flex items-center justify-between pt-2 text-[9px] text-slate-500">
                        <button id="pagePrev" class="tab">‹ Prev</button>
                        <span id="pageInfo"></span>
                        <button id="pageNext" class="tab">Next ›</button>
                    </div>
                </div>
            </div>
            <div class="p-4 h-1/2 flex flex-col overflow-hidden">
                <h3 class="text-[9px] font-black text-slate-600 uppercase mb-3">Squad Roster</h3>
                <div id="teamList" class="flex-grow overflow-y-auto space-y-1 custom-scroll"></div>
            </div>
        </div>

        <!-- Center: Map -->
        <div id="viewport" class="flex-grow min-w-0 bg-black relative overflow-hidden">
            <canvas id="mapCanvas"></canvas>
            <div id="mapNotice" class="absolute top-3 left-1/2 -translate-x-1/2 text-[9px] font-bold uppercase text-slate-400 ui-card rounded px-3 py-1.5 hidden"></div>
            <div class="legend absolute top-3 left-3 ui-card rounded-lg p-2.5 text-[9px] text-slate-400 space-y-1 z-40">
                <div><i class="fa-solid fa-circle text-green-500"></i> Landing</div>
                <div><i class="fa-solid fa-xmark text-yellow-400"></i> Knock</div>
                <div><span class="inline-block w-[14px] text-center">💀</span> Kill</div>
                <div><i class="fa-solid fa-circle-xmark text-purple-400"></i> Knocked</div>
                <div><i class="fa-solid fa-xmark text-red-500"></i> Death</div>
            </div>
            <div id="heatCard" class="hidden absolute top-3 right-3 ui-card rounded-lg p-3 text-[9px] text-slate-300 z-40 w-52 space-y-2">
                <div class="flex items-center justify-between">
                    <span class="font-black uppercase text-orange-500">Heatmap</span>
                    <span id="heatStatus" class="text-slate-500 text-right"></span>
                </div>
                <div id="heatLayers" class="grid grid-cols-2 gap-x-2 gap-y-1"></div>
                <select id="heatScope" class="flt w-full">
                    <option value="match">This match</option>
                    <option value="all">All matches on this map</option>
                </select>
                <div class="heat-legend"></div>
                <div class="flex justify-between text-slate-500"><span>low</span><span>high</span></div>
            </div>
            <div id="phaseNav" class="absolute bottom-8 left-1/2 -translate-x-1/2 flex flex-wrap justify-center gap-1.5 p-1.5 ui-card rounded-xl shadow-2xl z-50 border border-white/10"></div>
            <div id="tooltip"></div>
        </div>

        <!-- Right: Log & Stats -->
        <div class="w-72 shrink-0 bg-[#0c0e12] border-l border-white/5 flex flex-col z-40">
            <div class="p-4 border-b border-white/5 h-[55%] flex flex-col overflow-hidden">
                <h3 class="text-[9px] font-black text-slate-600 uppercase mb-3">Combat Log</h3>
                <div id="eventList" class="flex-grow overflow-y-auto space-y-1.5 custom-scroll pr-1"></div>
            </div>
            <div class="p-4 h-[45%] bg-[#0e1014] flex flex-col overflow-hidden">
                <h3 class="text-[9px] font-black text-slate-600 uppercase mb-3">Statistics</h3>
                <div id="playerStats" class="grid grid-cols-3 gap-1.5 mb-3 overflow-y-auto custom-scroll"></div>
                <div class="mt-auto border-t border-white/5 pt-3 space-y-2">
                    <label class="flex items-center justify-between cursor-pointer group">
                        <span class="text-[9px] font-bold text-slate-500 group-hover:text-slate-300">PLANE PATH</span>
                        <input type="checkbox" id="planeToggle" class="accent-orange-500" checked>
                    </label>
                    <label class="flex items-center justify-between cursor-pointer group">
                        <span class="text-[9px] font-bold text-slate-500 group-hover:text-slate-300">WHOLE SQUAD</span>
                        <input type="checkbox" id="squadToggle" class="accent-orange-500">
                    </label>
                    <label class="flex items-center justify-between cursor-pointer group">
                        <span class="text-[9px] font-bold text-slate-500 group-hover:text-slate-300">HEATMAP</span>
                        <input type="checkbox" id="heatToggle" class="accent-orange-500">
                    </label>
                </div>
            </div>
        </div>
    </div>

    <!-- Loader -->
    <div id="loader" class="fixed inset-0 z-[100] bg-[#080a0c]/90 flex flex-col items-center justify-center hidden">
        <div class="w-10 h-10 border-2 border-orange-500 border-t-transparent rounded-full animate-spin mb-4"></div>
        <p id="loaderText" class="text-[10px] font-black uppercase text-slate-500 italic">Processing Telemetry...</p>
    </div>

    <script>
        const SQUAD_COLORS = ['#f97316', '#38bdf8', '#a3e635', '#e879f9'];
        const EVENT_LABELS = { KILL: 'Kill', FINISH: 'Finish', KNOCK: 'Knock', KNOCKED: 'Knocked by', REVIVE: 'Revived', REVIVED: 'Revived by', DEATH: 'Killed by' };
        const MODE_NAMES = { 'squad-fpp': 'Squad FPP', 'squad': 'Squad TPP', 'duo-fpp': 'Duo FPP', 'duo': 'Duo TPP', 'solo-fpp': 'Solo FPP', 'solo': 'Solo TPP' };

        const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const fmtClock = (t) => t == null ? '' : `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`;
        const fmtMode = (m) => MODE_NAMES[m] || String(m || '').replace(/-/g, ' ');
        // Numbers from match data go into HTML: never trust them to be numbers
        const num = (v) => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
        const STORED_PAGE_SIZE = 15;

        class Visualizer {
            constructor() {
                this.canvas = document.getElementById('mapCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.viewport = document.getElementById('viewport');
                this.mapImg = null;
                this.scale = 1; this.offsetX = 0; this.offsetY = 0;
                this.currentPhase = -1;
                this.loadToken = 0;
                this.dictionaries = null;
                this.events = [];
                this.heat = { scope: 'match', layers: new Set(PubgHeatmap.LAYERS.filter((l) => l.on).map((l) => l.id)), canvas: null, token: 0, cache: new Map() };
                this.stored = { page: 1, filtersLoaded: false };
                this.setupInteractions();
                this.initApp();
            }

            resize() {
                this.canvas.width = this.viewport.clientWidth;
                this.canvas.height = this.viewport.clientHeight;
                this.render();
            }

            loader(on, text) {
                document.getElementById('loader').classList.toggle('hidden', !on);
                if (text) document.getElementById('loaderText').textContent = text;
            }

            notice(text) {
                const el = document.getElementById('mapNotice');
                el.textContent = text || '';
                el.classList.toggle('hidden', !text);
            }

            async initApp() {
                this.resize();
                window.addEventListener('resize', () => this.resize());
                document.getElementById('planeToggle').onchange = () => this.render();
                document.getElementById('squadToggle').onchange = () => this.render();
                this.setupHeatmapUI();

                this.source = await PubgData.getSource();
                if (!this.source) { location.replace('start.html'); return; }
                if (this.source.mode !== 'server') {
                    const badge = document.getElementById('modeBadge');
                    badge.textContent = this.source.mode === 'demo' ? 'Demo data' : 'Browser mode';
                    badge.classList.remove('hidden');
                }
                document.querySelector('#heatScope option[value="all"]').textContent =
                    this.source.mode === 'server' ? 'All stored matches on this map' : 'All loaded matches on this map';
                let list, dict;
                try {
                    [list, dict] = await Promise.all([this.source.list(), this.source.dictionaries()]);
                } catch (err) {
                    this.notice(err.message); return;
                }
                this.dictionaries = dict;
                const storedCount = this.source.stored ? await this.setupStoredUI() : 0;
                if (!list.length && !storedCount) { location.replace('start.html'); return; }

                const listEl = document.getElementById('matchList');
                listEl.innerHTML = list.map((m) => this.matchItemHtml(m, `r-${num(m.id)}`)).join('');
                listEl.onclick = (e) => { const it = e.target.closest('[data-key]'); if (it) this.loadMatch(num(it.dataset.id), it.dataset.key); };
                if (list.length && location.hash !== '#stored') this.loadMatch(1, 'r-1');
                else { this.showTab('stored'); this.loadStoredPage(1, true); }
            }

            matchItemHtml(m, key, extra = {}) {
                const attrs = Object.entries(extra).map(([k, v]) => ` data-${k}="${esc(v)}"`).join('');
                const rank = num(m.rank);
                return `
                    <div data-key="${esc(key)}" data-id="${num(m.id)}"${attrs} class="m-item p-2.5 rounded bg-white/5 flex justify-between items-center group">
                        <div class="truncate mr-2">
                            <div class="text-[10px] font-black group-hover:text-orange-500 uppercase">${esc(m.map)}${m.player ? ` <span class="text-slate-500 normal-case font-bold">· ${esc(m.player)}</span>` : ''}</div>
                            <div class="text-[8px] text-slate-500">${esc(m.date)} · ${esc(fmtMode(m.mode))}</div>
                            <div class="text-[8px] text-slate-400">${num(m.kills)} kills · ${num(m.knocks)} knocks · ${num(m.damage)} dmg</div>
                        </div>
                        <div class="text-[11px] font-black ${rank === 1 ? 'text-yellow-500' : 'text-slate-500'}">#${rank}</div>
                    </div>`;
            }

            // --- Local match database (server mode) ---
            async setupStoredUI() {
                let f;
                try { f = await this.source.historyFilters(); } catch (e) { return 0; }
                document.getElementById('historyTabs').classList.remove('hidden');
                document.getElementById('storedCount').textContent = `(${num(f.counts && f.counts.matches)})`;
                const opt = (v, label) => `<option value="${esc(v)}">${esc(label)}</option>`;
                document.getElementById('fltPlayer').innerHTML = opt('', 'All players') + f.players.map((p) => opt(p.account_id, `${p.name} (${num(p.matches)})`)).join('');
                document.getElementById('fltMap').innerHTML = opt('', 'All maps') + f.maps.map((m) => opt(m.id, m.name)).join('');
                document.getElementById('fltMode').innerHTML = opt('', 'All modes') + f.modes.map((m) => opt(m, fmtMode(m))).join('');
                ['fltPlayer', 'fltMap', 'fltMode'].forEach((id) => { document.getElementById(id).onchange = () => this.loadStoredPage(1); });
                document.getElementById('historyTabs').onclick = (e) => {
                    const b = e.target.closest('[data-tab]');
                    if (!b) return;
                    this.showTab(b.dataset.tab);
                    if (b.dataset.tab === 'stored') this.loadStoredPage(this.stored.page);
                };
                document.getElementById('pagePrev').onclick = () => this.loadStoredPage(this.stored.page - 1);
                document.getElementById('pageNext').onclick = () => this.loadStoredPage(this.stored.page + 1);
                document.getElementById('storedList').onclick = (e) => {
                    const it = e.target.closest('[data-key]');
                    if (it) this.loadMatch({ match_id: it.dataset.mid, account_id: it.dataset.acc }, it.dataset.key);
                };
                return num(f.counts && f.counts.matches);
            }

            showTab(tab) {
                document.querySelectorAll('#historyTabs [data-tab]').forEach((b) => b.classList.toggle('active', b.dataset.tab === tab));
                document.getElementById('matchList').classList.toggle('hidden', tab !== 'recent');
                document.getElementById('storedPanel').classList.toggle('hidden', tab !== 'stored');
            }

            async loadStoredPage(page, openFirst) {
                const params = {
                    player: document.getElementById('fltPlayer').value, map: document.getElementById('fltMap').value,
                    mode: document.getElementById('fltMode').value, page: Math.max(1, page), per_page: STORED_PAGE_SIZE,
                };
                const listEl = document.getElementById('storedList');
                let res;
                try { res = await this.source.history(params); } catch (e) { listEl.innerHTML = `<div class="text-[9px] text-red-400">${esc(e.message)}</div>`; return; }
                this.stored.page = res.page;
                listEl.innerHTML = res.items.length ? res.items.map((m) => this.matchItemHtml(
                    { map: m.map_name, player: m.name, date: m.date, mode: m.game_mode, kills: m.kills, knocks: m.knocks, damage: m.damage, rank: m.rank },
                    `s-${m.match_id}-${m.account_id}`, { mid: m.match_id, acc: m.account_id })).join('')
                    : '<div class="text-[9px] text-slate-600">No stored matches for this filter</div>';
                document.getElementById('pageInfo').textContent = `${res.page} / ${res.pages} · ${res.total} matches`;
                document.getElementById('pagePrev').disabled = res.page <= 1;
                document.getElementById('pageNext').disabled = res.page >= res.pages;
                this.markSelected();
                if (openFirst && res.items.length) {
                    const m = res.items[0];
                    this.loadMatch({ match_id: m.match_id, account_id: m.account_id }, `s-${m.match_id}-${m.account_id}`);
                }
            }

            markSelected() {
                document.querySelectorAll('.m-item').forEach((el) => el.classList.toggle('selected', el.dataset.key === this.selectedKey));
            }

            async loadMatch(ref, key) {
                const token = ++this.loadToken;
                this.loader(true, 'Loading match...');
                this.selectedKey = key;
                this.markSelected();
                try {
                    const meta = await this.source.meta(ref);
                    if (token !== this.loadToken) return;
                    this.meta = meta;
                    this.mapUnits = PubgTelemetry.MAP_SIZES[meta.map] || 816000;
                    document.getElementById('matchTitle').textContent = `${meta.map_name} · ${fmtMode(meta.mode)} · ${meta.date} · #${meta.rank}`;

                    this.loader(true, 'Downloading telemetry...');
                    // Without telemetry the official stats are still shown, just without map events
                    let telemetryError = null;
                    const telemetryReq = this.source.telemetry(meta).catch((e) => { telemetryError = e; return []; });
                    const imgReq = this.loadImage(this.source.mapUrl(meta.map, 'low'));
                    const [events, img] = await Promise.all([telemetryReq, imgReq]);
                    if (token !== this.loadToken) return;

                    this.mapImg = img;
                    this.notice(telemetryError ? telemetryError.message : (img ? '' : 'Map image is unavailable'));
                    this.upgradeMapImage(meta.map, token);

                    this.events = events;
                    const team = meta.team_stats.map((t) => t.name);
                    const ranks = Object.fromEntries(meta.team_stats.map((t) => [t.name, t.rank]));
                    this.data = PubgTelemetry.parse(events, team, {
                        dictionaries: this.dictionaries,
                        mapUnits: this.mapUnits,
                        eliminated: (n) => ranks[n] !== 1,
                    });
                    this.currentPhase = -1;
                    this.renderTeamUI(meta.team_stats);
                    this.renderPhasesUI();
                    this.selectPlayer(meta.searched_nick);
                } catch (err) {
                    if (token === this.loadToken) this.notice(err.message || 'Failed to load the match');
                } finally {
                    if (token === this.loadToken) this.loader(false);
                }
            }

            loadImage(src) {
                return new Promise((resolve) => {
                    if (!src) { resolve(null); return; }
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.onerror = () => resolve(null);
                    img.src = src;
                });
            }

            // Show the light image right away, swap to the high-res one once it is downloaded and cached
            async upgradeMapImage(mapId, token) {
                const img = await this.loadImage(this.source.mapUrl(mapId, 'high'));
                if (img && token === this.loadToken) { this.mapImg = img; this.render(); }
            }

            renderTeamUI(stats) {
                const el = document.getElementById('teamList');
                el.innerHTML = stats.map((t, i) => `
                    <button data-nick="${esc(t.name)}" class="squad-btn btn w-full p-2.5 rounded text-left bg-white/5 hover:bg-white/10 flex justify-between items-center group">
                        <span class="truncate group-hover:text-orange-500"><span style="color:${SQUAD_COLORS[i % 4]}">●</span> ${esc(t.name)}</span>
                        <span class="opacity-60 text-[8px] font-black whitespace-nowrap">${num(t.kills)}K · ${num(t.knocks)}DB</span>
                    </button>`).join('');
                el.onclick = (e) => { const b = e.target.closest('[data-nick]'); if (b) this.selectPlayer(b.dataset.nick); };
            }

            renderPhasesUI() {
                const nav = document.getElementById('phaseNav');
                nav.innerHTML = `<button data-phase="-1" class="btn px-3 py-1.5 rounded-lg active">All</button>` +
                    this.data.phases.map((p, i) => `<button data-phase="${i}" title="${fmtClock(p.t)}" class="btn px-3 py-1.5 rounded-lg">P${i + 1}</button>`).join('');
                nav.onclick = (e) => { const b = e.target.closest('[data-phase]'); if (b) this.setPhase(+b.dataset.phase); };
            }

            selectPlayer(nick) {
                if (!this.data.players[nick]) nick = this.meta.team_stats[0].name;
                this.currentNick = nick;
                document.querySelectorAll('.squad-btn').forEach((b) => b.classList.toggle('active', b.dataset.nick === nick));

                const d = this.data.players[nick];
                const s = this.meta.team_stats.find((t) => t.name === nick);

                // Counters come from the official match stats; telemetry gives positions and details
                document.getElementById('quickStats').innerHTML =
                    `<span>Kills: ${num(s.kills)}</span><span>Knocks: ${num(s.knocks)}</span><span>Damage: ${num(s.damage)}</span>`;

                const list = document.getElementById('eventList');
                list.innerHTML = d.timeline.length ? d.timeline.map((e, i) => this.eventHtml(e, i)).join('')
                    : `<div class="text-[9px] text-slate-600">No combat events</div>`;
                list.onclick = (ev) => {
                    const it = ev.target.closest('[data-ev]');
                    if (it) this.focusOn(d.timeline[+it.dataset.ev].loc);
                };

                const stat = (label, value, cls = '') => `<div class="stat"><div class="stat-l">${label}</div><div class="stat-v ${cls}">${esc(value)}</div></div>`;
                document.getElementById('playerStats').innerHTML = [
                    stat('Kills', num(s.kills), 'text-orange-500'),
                    stat('Knocks', num(s.knocks), 'text-yellow-400'),
                    stat('Assists', num(s.assists)),
                    stat('Damage', num(s.damage)),
                    stat('Headshots', num(s.headshots)),
                    stat('Longest', `${num(s.longest)}m`),
                    stat('Revives', num(s.revives)),
                    stat('Survived', fmtClock(num(s.survived))),
                    stat('Distance', `${(num(s.dist) / 1000).toFixed(1)}km`),
                ].join('');
                this.autoFocus(); this.render();
                this.updateHeatmap();
            }

            eventHtml(e, i) {
                const hs = e.headshot ? ' <span class="hs">HS</span>' : '';
                const tk = e.teamKill ? ' <span class="hs">TEAM</span>' : '';
                let sub = '';
                if (e.type === 'DEATH') sub = e.unknown ? 'Kill event missing in telemetry' : `${esc(e.weapon)}${e.dist ? ` · ${num(e.dist)}m` : ''}`;
                else if (e.type === 'REVIVE' || e.type === 'REVIVED') sub = '';
                else sub = `${esc(e.weapon)}${e.dist ? ` · ${num(e.dist)}m` : ''}`;
                return `<div data-ev="${i}" class="ev ev-${e.type}">
                    <span class="ev-time">${fmtClock(e.t)}</span>
                    ${e.unknown ? '<b>Eliminated</b>' : `<b>${EVENT_LABELS[e.type]}:</b> ${esc(e.suicide ? 'Suicide' : e.name)}`}${hs}${tk}
                    ${sub ? `<div class="ev-sub">${sub}</div>` : ''}
                </div>`;
            }

            setPhase(idx) {
                this.currentPhase = idx;
                document.querySelectorAll('#phaseNav .btn').forEach((b) => b.classList.toggle('active', +b.dataset.phase === idx));
                this.render();
            }

            // Telemetry (cm) -> map image pixels (2048 virtual)
            px(v) { return v / this.mapUnits * 2048; }

            autoFocus() {
                const d = this.data.players[this.currentNick];
                const pts = [...d.path, ...d.timeline.map((e) => e.loc)].filter(Boolean);
                if (!pts.length) { this.fitMap(); return; }
                let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
                pts.forEach((p) => { minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y); });
                const pad = this.mapUnits * 0.04;
                const w = this.px(maxX - minX + pad * 2), h = this.px(maxY - minY + pad * 2);
                this.scale = Math.min(this.canvas.width / w, this.canvas.height / h, 12);
                this.offsetX = this.canvas.width / 2 - this.px((minX + maxX) / 2) * this.scale;
                this.offsetY = this.canvas.height / 2 - this.px((minY + maxY) / 2) * this.scale;
            }

            fitMap() {
                this.scale = Math.min(this.canvas.width, this.canvas.height) / 2048;
                this.offsetX = (this.canvas.width - 2048 * this.scale) / 2;
                this.offsetY = (this.canvas.height - 2048 * this.scale) / 2;
            }

            focusOn(loc) {
                if (!loc) return;
                this.scale = Math.max(this.scale, 4);
                this.offsetX = this.canvas.width / 2 - this.px(loc.x) * this.scale;
                this.offsetY = this.canvas.height / 2 - this.px(loc.y) * this.scale;
                this.render();
            }

            setupInteractions() {
                this.canvas.addEventListener('mousedown', (e) => { this.isDrag = true; this.last = { x: e.clientX, y: e.clientY }; this.canvas.classList.add('dragging'); });
                window.addEventListener('mousemove', (e) => {
                    if (this.isDrag) {
                        this.offsetX += e.clientX - this.last.x; this.offsetY += e.clientY - this.last.y;
                        this.last = { x: e.clientX, y: e.clientY }; this.render();
                    }
                    const rect = this.canvas.getBoundingClientRect();
                    this.handleHover(e.clientX - rect.left, e.clientY - rect.top);
                });
                window.addEventListener('mouseup', () => { this.isDrag = false; this.canvas.classList.remove('dragging'); });
                this.canvas.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    const k = e.deltaY > 0 ? 0.9 : 1.1;
                    const ns = Math.min(Math.max(this.scale * k, 0.1), 40);
                    const f = ns / this.scale;
                    this.offsetX = e.offsetX - (e.offsetX - this.offsetX) * f;
                    this.offsetY = e.offsetY - (e.offsetY - this.offsetY) * f;
                    this.scale = ns; this.render();
                }, { passive: false });
            }

            handleHover(mx, my) {
                const tip = document.getElementById('tooltip');
                const d = this.data && this.data.players[this.currentNick];
                const inside = mx >= 0 && my >= 0 && mx <= this.canvas.width && my <= this.canvas.height;
                if (!d || !inside || this.isDrag) { tip.style.display = 'none'; return; }

                let found = null, bestDist = 18;
                for (const m of d.timeline) {
                    if (!m.loc) continue;
                    const dd = Math.hypot(mx - (this.px(m.loc.x) * this.scale + this.offsetX), my - (this.px(m.loc.y) * this.scale + this.offsetY));
                    if (dd < bestDist) { bestDist = dd; found = m; }
                }
                if (!found) { tip.style.display = 'none'; return; }

                const colors = { KILL: '#ef4444', FINISH: '#fb923c', KNOCK: '#eab308', KNOCKED: '#a855f7', REVIVE: '#22c55e', REVIVED: '#22c55e', DEATH: '#ffffff' };
                const color = colors[found.type];
                const isOwn = ['KILL', 'FINISH', 'KNOCK', 'REVIVE'].includes(found.type);
                const row = (l, v) => `<div class="tooltip-row"><span class="tooltip-label">${l}</span><span class="tooltip-value">${v}</span></div>`;
                tip.innerHTML = `
                    <div class="tooltip-header" style="color:${color};border-color:${color}55;background:${color}1f">${EVENT_LABELS[found.type]} · ${fmtClock(found.t)}</div>
                    <div class="tooltip-body">
                        ${row(isOwn ? 'Target' : 'By', esc(found.suicide ? 'Suicide' : found.name))}
                        ${found.weapon ? row('Weapon', esc(found.weapon) + (found.headshot ? ' <span class="hs">HS</span>' : '')) : ''}
                        ${found.dist ? row('Distance', `${num(found.dist)}m`) : ''}
                    </div>`;
                tip.style.display = 'block';
                const vw = this.viewport.clientWidth, vh = this.viewport.clientHeight;
                tip.style.left = Math.min(mx + 15, vw - tip.offsetWidth - 8) + 'px';
                tip.style.top = Math.min(my + 15, vh - tip.offsetHeight - 8) + 'px';
            }

            // --- Heatmap ---
            setupHeatmapUI() {
                const layersEl = document.getElementById('heatLayers');
                layersEl.innerHTML = PubgHeatmap.LAYERS.map((l) => `
                    <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" data-layer="${l.id}" class="accent-orange-500" ${this.heat.layers.has(l.id) ? 'checked' : ''}> ${esc(l.label)}</label>`).join('');
                layersEl.onchange = (e) => {
                    const id = e.target.dataset.layer;
                    if (!id) return;
                    if (e.target.checked) this.heat.layers.add(id); else this.heat.layers.delete(id);
                    this.updateHeatmap();
                };
                document.getElementById('heatToggle').onchange = (e) => {
                    document.getElementById('heatCard').classList.toggle('hidden', !e.target.checked);
                    this.updateHeatmap();
                };
                document.getElementById('heatScope').onchange = (e) => { this.heat.scope = e.target.value; this.updateHeatmap(); };
            }

            heatStatus(text) { document.getElementById('heatStatus').textContent = text || ''; }

            async heatPoints(scope, player) {
                if (scope === 'match') return { matches: 1, layers: PubgHeatmap.extractPoints(this.events, player) };
                const key = `${this.meta.map}|${player.account_id || player.name}`;
                if (!this.heat.cache.has(key)) {
                    const res = await this.source.heatmapAll(this.meta, player, PubgHeatmap.extractPoints,
                        (i, n) => this.heatStatus(`Loading ${i}/${n}...`));
                    // A server answer without every match's telemetry is not cached: it fills in as downloads finish
                    if (!res.missing_telemetry || this.source.mode !== 'server') this.heat.cache.set(key, res);
                    return res;
                }
                return this.heat.cache.get(key);
            }

            async updateHeatmap() {
                const token = ++this.heat.token;
                const on = document.getElementById('heatToggle').checked;
                if (!on || !this.meta || !this.currentNick) { this.heat.canvas = null; this.render(); return; }
                const s = this.meta.team_stats.find((t) => t.name === this.currentNick) || {};
                const player = { name: this.currentNick, account_id: s.account_id || '' };
                const scope = this.heat.scope;
                this.heatStatus('Loading...');
                let res;
                try {
                    res = await this.heatPoints(scope, player);
                } catch (e) {
                    if (token === this.heat.token) { this.heatStatus(e.message || 'Heatmap failed'); this.heat.canvas = null; this.render(); }
                    return;
                }
                if (token !== this.heat.token) return;
                const grid = PubgHeatmap.buildGrid(res.layers, [...this.heat.layers], { size: 256, mapUnits: this.mapUnits });
                const c = document.createElement('canvas');
                c.width = c.height = grid.size;
                c.getContext('2d').putImageData(new ImageData(PubgHeatmap.colorize(grid), grid.size, grid.size), 0, 0);
                this.heat.canvas = grid.points ? c : null;
                const n = num(res.matches);
                let status = scope === 'match' ? `${grid.points} points` : `${n} match${n === 1 ? '' : 'es'} · ${grid.points} pts`;
                if (scope !== 'match' && num(res.missing_telemetry)) status += ` (${num(res.missing_telemetry)} downloading)`;
                this.heatStatus(grid.points ? status : 'No data for these layers');
                this.render();
            }

            drawPath(ctx, d, color, width) {
                if (d.jump && d.landing) {
                    ctx.beginPath(); ctx.strokeStyle = color + '88'; ctx.setLineDash([6 / this.scale, 6 / this.scale]); ctx.lineWidth = 2 / this.scale;
                    ctx.moveTo(this.px(d.jump.x), this.px(d.jump.y)); ctx.lineTo(this.px(d.landing.x), this.px(d.landing.y)); ctx.stroke(); ctx.setLineDash([]);
                }
                if (d.path.length < 2) return;
                ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = width / this.scale; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
                d.path.forEach((p, i) => i === 0 ? ctx.moveTo(this.px(p.x), this.px(p.y)) : ctx.lineTo(this.px(p.x), this.px(p.y)));
                ctx.stroke();
            }

            drawCross(ctx, loc, color, size, width) {
                const x = this.px(loc.x), y = this.px(loc.y), s = size / this.scale;
                ctx.strokeStyle = '#000'; ctx.lineWidth = (width + 3) / this.scale;
                ctx.beginPath(); ctx.moveTo(x - s, y - s); ctx.lineTo(x + s, y + s); ctx.moveTo(x + s, y - s); ctx.lineTo(x - s, y + s); ctx.stroke();
                ctx.strokeStyle = color; ctx.lineWidth = width / this.scale;
                ctx.beginPath(); ctx.moveTo(x - s, y - s); ctx.lineTo(x + s, y + s); ctx.moveTo(x + s, y - s); ctx.lineTo(x - s, y + s); ctx.stroke();
            }

            drawDot(ctx, loc, color, r) {
                ctx.fillStyle = color; ctx.beginPath(); ctx.arc(this.px(loc.x), this.px(loc.y), r / this.scale, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 2 / this.scale; ctx.stroke();
            }

            render() {
                const ctx = this.ctx;
                ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                if (!this.data || !this.currentNick) return;
                const d = this.data.players[this.currentNick];
                ctx.save(); ctx.translate(this.offsetX, this.offsetY); ctx.scale(this.scale, this.scale);
                ctx.imageSmoothingEnabled = true;
                if (this.mapImg) ctx.drawImage(this.mapImg, 0, 0, 2048, 2048);
                else { ctx.fillStyle = '#0d1117'; ctx.fillRect(0, 0, 2048, 2048); }
                if (this.heat.canvas) ctx.drawImage(this.heat.canvas, 0, 0, 2048, 2048);

                const p = this.data.phases[this.currentPhase];
                if (p) {
                    ctx.strokeStyle = '#3b82f6cc'; ctx.lineWidth = 4 / this.scale; ctx.beginPath(); ctx.arc(this.px(p.blue.x), this.px(p.blue.y), this.px(p.blue.r), 0, Math.PI * 2); ctx.stroke();
                    ctx.strokeStyle = '#ffffffcc'; ctx.lineWidth = 3 / this.scale; ctx.beginPath(); ctx.arc(this.px(p.white.x), this.px(p.white.y), this.px(p.white.r), 0, Math.PI * 2); ctx.stroke();
                }
                const pp = this.data.planePath;
                if (document.getElementById('planeToggle').checked && pp) {
                    const dx = pp.end.x - pp.start.x, dy = pp.end.y - pp.start.y, len = Math.hypot(dx, dy) || 1;
                    const ext = this.mapUnits * 1.5 / len;
                    ctx.beginPath(); ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.setLineDash([15 / this.scale, 15 / this.scale]); ctx.lineWidth = 3 / this.scale;
                    ctx.moveTo(this.px(pp.start.x - dx * ext), this.px(pp.start.y - dy * ext)); ctx.lineTo(this.px(pp.end.x + dx * ext), this.px(pp.end.y + dy * ext)); ctx.stroke(); ctx.setLineDash([]);
                }

                const team = this.meta.team_stats.map((t) => t.name);
                if (document.getElementById('squadToggle').checked) {
                    team.forEach((n, i) => { if (n !== this.currentNick) this.drawPath(ctx, this.data.players[n], SQUAD_COLORS[i % 4] + '99', 2.5); });
                }
                this.drawPath(ctx, d, SQUAD_COLORS[team.indexOf(this.currentNick) % 4] || '#f97316', 4);
                if (d.landing) this.drawDot(ctx, d.landing, '#22c55e', 7);

                d.knockedBy.forEach((k) => { if (k.loc) this.drawDot(ctx, k.loc, '#a855f7', 6); });
                d.knocks.forEach((k) => { if (k.loc) this.drawCross(ctx, k.loc, '#facc15', 6, 3); });
                ctx.font = `${18 / this.scale}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                [...d.kills, ...d.finishes].forEach((k) => { if (k.loc) ctx.fillText('💀', this.px(k.loc.x), this.px(k.loc.y)); });
                if (d.death && d.death.loc) this.drawCross(ctx, d.death.loc, '#ef4444', 12, 5);
                ctx.restore();
            }
        }
        const viz = new Visualizer();
    </script>
</body>
</html>
